<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dark Docs</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body>
  <header><img src="icons/48.png" width="36" height="36" alt=""><div><h1>Dark Docs</h1><p>A little easier on the eyes.</p></div></header>
  <main>
    <fieldset><legend>APPEARANCE</legend><div class="modes">
      <label><input type="radio" name="mode" value="system" checked><span>System</span></label>
      <label><input type="radio" name="mode" value="dark"><span>Dark</span></label>
      <label><input type="radio" name="mode" value="light"><span>Light</span></label>
    </div></fieldset>
    <p id="status" role="status">Following your computer’s appearance.</p>
    <label class="paper"><span><strong>Dark document pages</strong><small>Keep the whole workspace comfortable.</small></span><input id="dark-paper" type="checkbox" role="switch" checked></label>
    <p class="note">Turn off for original image and document colors. Your file and exports stay unchanged.</p>
  </main>
  <footer>Only in Google Docs. Always on your device.</footer>
</body></html>
