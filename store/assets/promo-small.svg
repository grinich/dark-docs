<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">Dark Docs — A calmer place to write</title>
  <desc id="desc">A quiet charcoal composition with a crescent moon and an abstract document, promoting automatic dark mode.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="280" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222222"/>
      <stop offset="1" stop-color="#353535"/>
    </linearGradient>
    <linearGradient id="paper" x1="281" y1="54" x2="408" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#414141"/>
      <stop offset="1" stop-color="#303030"/>
    </linearGradient>
    <filter id="shadow" x="-60%" y="-40%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#151515" flood-opacity="0.4"/>
    </filter>
    <mask id="moon">
      <rect width="440" height="280" fill="#000"/>
      <circle cx="335" cy="108" r="26" fill="#fff"/>
      <circle cx="348" cy="97" r="24" fill="#000"/>
    </mask>
  </defs>
  <rect width="440" height="280" fill="url(#background)"/>
  <circle cx="392" cy="64" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
  <circle cx="392" cy="64" r="143" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
  <g transform="rotate(-7 335 140)">
    <rect x="278" y="48" width="126" height="174" rx="14" fill="#2c2c2c" stroke="#454545"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="279" y="57" width="124" height="174" rx="14" fill="url(#paper)" stroke="#555555"/>
    <rect width="440" height="280" fill="#e3e3e3" mask="url(#moon)"/>
    <path d="M300 161h67M300 174h80M300 187h56" fill="none" stroke="#8c8c8c" stroke-width="4" stroke-linecap="round"/>
    <path d="M300 209h26" fill="none" stroke="#5e5e5e" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="32" y="106" fill="#f1f1f1" font-size="35" font-weight="600" letter-spacing="-1.3">Dark Docs</text>
    <text x="34" y="139" fill="#bdbdbd" font-size="15">A calmer place to write.</text>
    <path d="M34 170h27" stroke="#797979" stroke-width="2" stroke-linecap="round"/>
    <text x="34" y="201" fill="#d0d0d0" font-size="12.5">Automatic dark mode.</text>
    <text x="34" y="220" fill="#a9a9a9" font-size="12.5">Thoughtful shades of gray.</text>
  </g>
</svg>
